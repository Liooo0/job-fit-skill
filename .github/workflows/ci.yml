name: CI

on: [push, pull_request]

jobs:
  reproducibility:
    strategy:
      matrix:
        include:
          # ubuntu-26.04 镜像不再提供 3.9，钉 22.04 保住 README「Python 3.9+」承诺的实测
          - python-version: '3.9'
            runs-on: ubuntu-22.04
          - python-version: '3.11'
            runs-on: ubuntu-latest
          - python-version: '3.13'
            runs-on: ubuntu-latest
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装评分引擎（钉 v1.0.0 tag）
        run: pip install "jobhunter-engine @ git+https://github.com/Liooo0/job-hunter.git@v1.0.0"
      - name: 复跑示例并与 README/expected-output 逐字节比对
        run: |
          jobhunter-score "AI应用工程师" \
            --desc-file example/jd-sample.txt \
            --salary "15-25K" --city 深圳 \
            --config example/config.sample.json | diff -u - example/expected-output.txt
      - name: SKILL.md frontmatter 完整性
        run: |
          python3 - <<'EOF'
          from pathlib import Path
          import re, sys
          s = Path("SKILL.md").read_text(encoding="utf-8")
          fm = re.match(r"^---\n(.*?)\n---\n", s, re.S)
          assert fm, "SKILL.md 缺 frontmatter"
          name = re.search(r"^name: (\S+)$", fm.group(1), re.M)
          desc = re.search(r"^description: (.+)$", fm.group(1), re.M)
          assert name and desc, "frontmatter 缺 name/description"
          assert len(desc.group(1)) > 20, "description 太短，agent 无法路由"
          print("SKILL.md frontmatter ✓", name.group(1))
          EOF
