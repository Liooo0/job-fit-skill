name: CI

on: [push, pull_request]

jobs:
  reproducibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装评分引擎（钉 v1.0.0 tag）
        run: pip install "jobhunter-engine @ git+https://github.com/Liooo0/job-hunter.git@v1.0.0"
      - name: 复跑示例并与 README/expected-output 逐字节比对
        run: |
          jobhunter-score "AI应用工程师" \
            --desc-file example/jd-sample.txt \
            --salary "15-25K" --city 深圳 \
            --config example/config.sample.json | diff -u - example/expected-output.txt
      - name: SKILL.md frontmatter 完整性
        run: |
          python3 - <<'EOF'
          from pathlib import Path
          import re, sys
          s = Path("SKILL.md").read_text(encoding="utf-8")
          m = re.match(r"^---\nname: (\S+)\ndescription: (.+)\n---\n", s)
          assert m, "SKILL.md 缺 frontmatter 或字段不全"
          assert len(m.group(2)) > 20, "description 太短，agent 无法路由"
          print("SKILL.md frontmatter ✓", m.group(1))
          EOF
